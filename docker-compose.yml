version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: infinity_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: mt5_license
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: infinity_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:supersecretpassword@db:5432/mt5_license
      - API_BASE_URL=http://backend:8000/api/v1
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_TOKEN=supersecretadmin123
      - JWT_SECRET=yoursupersecretjwtkey
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infinity_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: infinity_telegram_bot
    restart: always
    depends_on:
      - backend
    environment:
      - TELEGRAM_BOT_TOKEN=your_telegram_bot_token_here
      - API_BASE_URL=http://backend:8000/api/v1
      - ADMIN_CHAT_ID=your_admin_chat_id_here
      - WEB_APP_URL=http://localhost:3000

volumes:
  pgdata:
